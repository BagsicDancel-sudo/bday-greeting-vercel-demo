<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            animation: fadeIn 1.2s ease-in-out;
        }

        .balloons {
            font-size: 40px;
            margin-bottom: 15px;
            animation: bounce 2s infinite ease-in-out;
        }

        h1 {
            color: #ff6b81;
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .message {
            color: #555555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .signature {
            font-style: italic;
            color: #888888;
            font-size: 0.95rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="balloons">🎈 🎉 🎂</div>
        <h1>Happy Birthday!</h1>
        <p class="message">
            Wishing you a day filled with happiness, laughter, and all the things that make you smile. May this year bring you closer to all your dreams and goals! Have an amazing celebration!
        </p>
        <div class="signature">
            From, <br><strong>[Pangalan Mo]</strong>
        </div>
    </div>

</body>
</html>
